name: Test

on:
  pull_request:
  push:
    branches: [master, redwood, verawood-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: test (${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Redwood image runs Python 3.11, the Verawood image 3.12.
          # setup-python takes the newest patch release of each.
          - release: redwood
            python: "3.11"
          - release: verawood
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tests/constraints-${{ matrix.release }}.txt
            setup.py
            requirements/base.in

      # pytest's own exit code decides this step. Nothing wraps it, so a failing
      # test fails the job.
      - name: Test
        run: make test RELEASE=${{ matrix.release }} PYTHON=python

  # A required status check needs one fixed name. The matrix jobs report as
  # "test (redwood)" and "test (verawood)". This job is "test". It passes only
  # when every release passed, and it still runs when one failed or was cancelled,
  # so it reports the failure.
  test:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every release passed
        run: test "${{ needs.release.result }}" = success
